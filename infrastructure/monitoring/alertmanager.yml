# ============================================================================ #
#                    TEVANOXMOVIE ALERTMANAGER CONFIGURATION                  #
# ============================================================================ #

route:
  group_by: ['alertname', 'cluster']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'email-notifications'

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: 'alerts@tevanox.com'
        from: 'alerts@tevanox.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'alerts@tevanox.com'
        auth_identity: 'alerts@tevanox.com'
        auth_password: '${SMTP_PASSWORD}'

  - name: 'slack-notifications'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        title: 'TevanoxMovie Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']