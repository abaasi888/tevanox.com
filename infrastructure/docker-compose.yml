version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    container_name: tevanoxmovie-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1
      MONGO_INITDB_DATABASE: tevanoxmovie
    volumes:
      - mongodb_data:/data/db
    networks:
      - tevanox-network

  backend:
    build:
      context: ../apps/tevanoxmovie-backend
      dockerfile: Dockerfile
    container_name: tevanoxmovie-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://admin:1@mongodb:27017
      SECRET_KEY: 17b3d627aed12b8f47b3b0ca6d0edc66279173e65f59f6580f8b7a419143ffb7
      DOMAIN: tevanox.com
      API_URL: https://api.tevanox.com
    depends_on:
      - mongodb
    networks:
      - tevanox-network

  web:
    build:
      context: ../apps/tevanoxmovie-web
      dockerfile: Dockerfile
    container_name: tevanoxmovie-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: https://api.tevanox.com/api/v1
    depends_on:
      - backend
    networks:
      - tevanox-network

  admin:
    build:
      context: ../apps/tevanoxmovie-admin
      dockerfile: Dockerfile
    container_name: tevanoxmovie-admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: https://api.tevanox.com/api/v1
    depends_on:
      - backend
    networks:
      - tevanox-network

  nginx:
    image: nginx:alpine
    container_name: tevanoxmovie-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - certbot_data:/var/www/certbot
    depends_on:
      - web
      - admin
      - backend
    networks:
      - tevanox-network

  certbot:
    image: certbot/certbot:latest
    container_name: tevanoxmovie-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $$!; done;'"

networks:
  tevanox-network:
    driver: bridge

volumes:
  mongodb_data:
  certbot_data:
